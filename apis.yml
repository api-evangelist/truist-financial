  name: Truist Personal and Small Business Client Contact API
  tags:
  - Client Management
  - Personal Banking
  - Small Business
  - Contact Information
  - Banking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.truist.com/v1
  humanURL: https://developer.truist.com/api/personal-and-small-business-client-contact/overview
  properties:
  - url: https://developer.truist.com/api/personal-and-small-business-client-contact/overview
    type: Documentation
  - url: https://developer.truist.com/api/working-with-truist
    type: Authentication
  description: >-
    The Truist Personal and Small Business Client Contact API provides access to client contact information
    associated with personal and small business accounts, including address, phone number, and email address
    data. This API enables authorized applications to retrieve and manage contact details for authenticated
    Truist clients, supporting CRM integrations and account management workflows.
- aid: truist-financial:truist-commercial-account-transaction-image-api
  name: Truist Commercial Account Transaction Image API
  tags:
  - Transaction
  - Check Images
  - Commercial Banking
  - Documents
  - Banking
  tags_raw:
  - Transactions
  - Check Images
  - Commercial Banking
  - Documents
  - Banking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.truist.com/v1
  humanURL: https://developer.truist.com/api/commercial-account-transaction-image/overview
  properties:
  - url: https://developer.truist.com/api/commercial-account-transaction-image/overview
    type: Documentation
  - url: https://developer.truist.com/api/working-with-truist
    type: Authentication
  description: >-
    The Truist Commercial Account Transaction Image API provides access to check images and transaction
    document images associated with commercial account transactions. Developers can retrieve front and
    back images of checks, deposit slips, and other payment documents by transaction reference. The API
    supports document archiving, audit workflows, and automated reconciliation integrations for commercial
    banking clients.
- aid: truist-financial:truist-open-banking-api
  name: Truist Open Banking API
  tags:
  - Open Banking
  - FDX
  - Financial Data Exchange
  - Account
  - Banking
  tags_raw:
  - Open Banking
  - FDX
  - Financial Data Exchange
  - Accounts
  - Banking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.truist.com/v1
  humanURL: https://truist-1132.my.site.com/truist/s/
  properties:
  - url: https://truist-1132.my.site.com/truist/s/
    type: Portal
  - url: https://truist-1132.my.site.com/truist/s/subscriptions
    type: Documentation
  - url: >-
      https://www.prnewswire.com/news-releases/truist-launches-secure-open-banking-experience-302685248.html
    type: Announcement
  description: >-
    The Truist Open Banking API provides secure, FDX-compliant (Financial Data Exchange) access to consumer
    and small business financial data, enabling authorized fintech applications to retrieve account balances,
    transaction history, and payment information with client consent. Launched in February 2026 in partnership
    with Mastercard's open finance platform, the API replaces credential sharing with tokenized, permission-based
    access. Truist expanded the program through a Plaid data-access agreement in March 2026, enabling
    clients to manage and revoke third-party data access through a centralized consent portal. The API
    supports account information, transaction data, investment data, and loan data per FDX standards.
- aid: truist-financial:truist-association-services-api
  name: Truist Association Services API
  tags:
  - Association Services
  - Community Banking
  - Banking
  - Payments
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.truist.com/v1
  humanURL: https://developer.truist.com/categories/association-services
  properties:
  - url: https://developer.truist.com/categories/association-services
    type: Documentation
  - url: https://developer.truist.com/api/working-with-truist
    type: Authentication
  description: >-
    The Truist Association Services API provides banking and payment capabilities tailored for associations,
    non-profit organizations, and community groups. The API supports dues collection, payment processing,
    member account management, and reporting for trade associations, homeowners associations, and membership
    organizations that bank with Truist. It enables integration of banking workflows into association
    management platforms and member portals.
