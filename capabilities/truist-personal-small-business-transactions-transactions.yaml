naftiko: 1.0.0-alpha2
info:
  label: Truist Personal and Small Business Transactions API — Transactions
  description: 'Truist Personal and Small Business Transactions API — Transactions. 2 operations. Lead operation: List Personal
    Account Transactions. Self-contained Naftiko capability covering one Truist Financial business surface.'
  tags:
  - Truist Financial
  - Transactions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUIST_FINANCIAL_API_KEY: TRUIST_FINANCIAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: truist-personal-small-business-transactions-transactions
    baseUri: https://api.truist.com/v1
    description: Truist Personal and Small Business Transactions API — Transactions business capability. Self-contained, no
      shared references.
    resources:
    - name: personal-accounts-accountId-transactions
      path: /personal/accounts/{accountId}/transactions
      operations:
      - name: listpersonaltransactions
        method: GET
        description: List Personal Account Transactions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountId
          in: path
          type: string
          description: Unique account identifier
          required: true
        - name: fromDate
          in: query
          type: string
          description: Start date for transaction retrieval (YYYY-MM-DD)
        - name: toDate
          in: query
          type: string
          description: End date for transaction retrieval (YYYY-MM-DD)
        - name: status
          in: query
          type: string
          description: Filter by transaction status
        - name: limit
          in: query
          type: integer
          description: Maximum number of transactions to return
        - name: offset
          in: query
          type: integer
          description: Pagination offset
    - name: personal-accounts-accountId-transactions-transactionId
      path: /personal/accounts/{accountId}/transactions/{transactionId}
      operations:
      - name: getpersonaltransaction
        method: GET
        description: Get Personal Transaction
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountId
          in: path
          type: string
          description: Unique account identifier
          required: true
        - name: transactionId
          in: path
          type: string
          description: Unique transaction identifier
          required: true
    authentication:
      type: bearer
      token: '{{env.TRUIST_FINANCIAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: truist-personal-small-business-transactions-transactions-rest
    port: 8080
    description: REST adapter for Truist Personal and Small Business Transactions API — Transactions. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/personal/accounts/{accountid}/transactions
      name: personal-accounts-accountid-transactions
      description: REST surface for personal-accounts-accountId-transactions.
      operations:
      - method: GET
        name: listpersonaltransactions
        description: List Personal Account Transactions
        call: truist-personal-small-business-transactions-transactions.listpersonaltransactions
        with:
          accountId: rest.accountId
          fromDate: rest.fromDate
          toDate: rest.toDate
          status: rest.status
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/personal/accounts/{accountid}/transactions/{transactionid}
      name: personal-accounts-accountid-transactions-transactionid
      description: REST surface for personal-accounts-accountId-transactions-transactionId.
      operations:
      - method: GET
        name: getpersonaltransaction
        description: Get Personal Transaction
        call: truist-personal-small-business-transactions-transactions.getpersonaltransaction
        with:
          accountId: rest.accountId
          transactionId: rest.transactionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: truist-personal-small-business-transactions-transactions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Truist Personal and Small Business Transactions API — Transactions. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: list-personal-account-transactions
      description: List Personal Account Transactions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: truist-personal-small-business-transactions-transactions.listpersonaltransactions
      with:
        accountId: tools.accountId
        fromDate: tools.fromDate
        toDate: tools.toDate
        status: tools.status
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: get-personal-transaction
      description: Get Personal Transaction
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: truist-personal-small-business-transactions-transactions.getpersonaltransaction
      with:
        accountId: tools.accountId
        transactionId: tools.transactionId
      outputParameters:
      - type: object
        mapping: $.
