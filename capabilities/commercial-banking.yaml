naftiko: 1.0.0-alpha2
info:
  label: Truist Commercial Banking
  description: Unified commercial banking capability combining commercial account management and transaction retrieval. Used
    by treasury teams, ERP integrations, and corporate finance applications to manage commercial deposit accounts, retrieve
    real-time balances, and access complete transaction history including ACH, wire transfers, and check payments for cash
    flow reconciliation and treasury management.
  tags:
  - Banking
  - Commercial Banking
  - Treasury
  - Accounts
  - Transactions
  - Payments
  - ACH
  - Wire Transfer
  created: '2026-05-03'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    TRUIST_COMMERCIAL_OAUTH2_TOKEN: TRUIST_COMMERCIAL_OAUTH2_TOKEN
capability:
  consumes:
  - type: http
    namespace: truist-commercial-accounts
    baseUri: https://api.truist.com/v1
    description: Commercial banking account information API.
    authentication:
      type: bearer
      token: '{{TRUIST_COMMERCIAL_OAUTH2_TOKEN}}'
    resources:
    - name: commercial-accounts
      path: /commercial/accounts
      description: Commercial deposit accounts
      operations:
      - name: list-commercial-accounts
        method: GET
        description: Retrieve a list of commercial deposit accounts for the authenticated organization.
        inputParameters:
        - name: customerId
          in: query
          type: string
          required: false
          description: Filter accounts by customer/organization identifier
        - name: accountType
          in: query
          type: string
          required: false
          description: Filter by account type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: commercial-account
      path: /commercial/accounts/{accountId}
      description: Individual commercial account details
      operations:
      - name: get-commercial-account
        method: GET
        description: Retrieve details for a specific commercial deposit account.
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
          description: Unique account identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: commercial-account-balances
      path: /commercial/accounts/{accountId}/balances
      description: Commercial account balance data
      operations:
      - name: get-commercial-account-balances
        method: GET
        description: Retrieve current and available balances for a commercial deposit account.
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
          description: Unique account identifier
        - name: asOfDate
          in: query
          type: string
          required: false
          description: Balance as of date (YYYY-MM-DD)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: commercial-account-summary
      path: /commercial/accounts/summary
      description: Consolidated commercial account summary
      operations:
      - name: get-commercial-account-summary
        method: GET
        description: Retrieve a consolidated balance summary across all commercial accounts.
        inputParameters:
        - name: customerId
          in: query
          type: string
          required: false
          description: Customer/organization identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: truist-commercial-transactions
    baseUri: https://api.truist.com/v1
    description: Commercial banking transaction history API.
    authentication:
      type: bearer
      token: '{{TRUIST_COMMERCIAL_OAUTH2_TOKEN}}'
    resources:
    - name: commercial-transactions
      path: /commercial/accounts/{accountId}/transactions
      description: Commercial account transaction history
      operations:
      - name: list-commercial-transactions
        method: GET
        description: Retrieve commercial account transactions including ACH, wires, and checks.
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
          description: Unique account identifier
        - name: fromDate
          in: query
          type: string
          required: false
          description: Start date (YYYY-MM-DD)
        - name: toDate
          in: query
          type: string
          required: false
          description: End date (YYYY-MM-DD)
        - name: transactionType
          in: query
          type: string
          required: false
          description: Filter by ACH, WIRE, CHECK, BOOK_TRANSFER, FEE, INTEREST, or ALL
        - name: debitCreditIndicator
          in: query
          type: string
          required: false
          description: Filter by DEBIT or CREDIT
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of transactions
        - name: offset
          in: query
          type: integer
          required: false
          description: Pagination offset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: commercial-transaction
      path: /commercial/accounts/{accountId}/transactions/{transactionId}
      description: Individual commercial transaction details
      operations:
      - name: get-commercial-transaction
        method: GET
        description: Retrieve details for a specific commercial account transaction.
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
          description: Unique account identifier
        - name: transactionId
          in: path
          type: string
          required: true
          description: Unique transaction identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8081
    namespace: truist-commercial-banking-api
    description: Unified REST API for commercial banking account management and transaction reporting.
    resources:
    - path: /v1/commercial/accounts
      name: commercial-accounts
      description: Commercial deposit accounts
      operations:
      - method: GET
        name: list-commercial-accounts
        description: List all commercial deposit accounts for the organization.
        call: truist-commercial-accounts.list-commercial-accounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/commercial/accounts/summary
      name: commercial-account-summary
      description: Consolidated commercial account balance summary
      operations:
      - method: GET
        name: get-commercial-account-summary
        description: Get consolidated balance summary across all commercial accounts.
        call: truist-commercial-accounts.get-commercial-account-summary
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/commercial/accounts/{accountId}
      name: commercial-account
      description: Individual commercial account
      operations:
      - method: GET
        name: get-commercial-account
        description: Get details for a specific commercial account.
        call: truist-commercial-accounts.get-commercial-account
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/commercial/accounts/{accountId}/balances
      name: commercial-account-balances
      description: Commercial account balance data
      operations:
      - method: GET
        name: get-commercial-account-balances
        description: Get ledger, available, collected, and float balances for a commercial account.
        call: truist-commercial-accounts.get-commercial-account-balances
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/commercial/accounts/{accountId}/transactions
      name: commercial-transactions
      description: Commercial account transaction history
      operations:
      - method: GET
        name: list-commercial-transactions
        description: List commercial transactions including ACH, wires, and checks.
        call: truist-commercial-transactions.list-commercial-transactions
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/commercial/accounts/{accountId}/transactions/{transactionId}
      name: commercial-transaction
      description: Individual commercial transaction
      operations:
      - method: GET
        name: get-commercial-transaction
        description: Get details for a specific commercial transaction.
        call: truist-commercial-transactions.get-commercial-transaction
        with:
          accountId: rest.accountId
          transactionId: rest.transactionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9081
    namespace: truist-commercial-banking-mcp
    transport: http
    description: MCP server for AI-assisted commercial banking, treasury management, and cash flow analysis.
    tools:
    - name: list-commercial-accounts
      description: List all commercial deposit accounts for the organization.
      hints:
        readOnly: true
        openWorld: false
      call: truist-commercial-accounts.list-commercial-accounts
      outputParameters:
      - type: object
        mapping: $.
    - name: get-commercial-account
      description: Get details for a specific commercial deposit account.
      hints:
        readOnly: true
        openWorld: false
      call: truist-commercial-accounts.get-commercial-account
      with:
        accountId: tools.accountId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-commercial-account-balances
      description: Get ledger, available, collected, and float balances for a commercial account. Used for daily balance reporting
        and intraday cash position monitoring.
      hints:
        readOnly: true
        openWorld: false
      call: truist-commercial-accounts.get-commercial-account-balances
      with:
        accountId: tools.accountId
        asOfDate: tools.asOfDate
      outputParameters:
      - type: object
        mapping: $.
    - name: get-commercial-account-summary
      description: Get a consolidated balance summary across all commercial accounts for the organization.
      hints:
        readOnly: true
        openWorld: false
      call: truist-commercial-accounts.get-commercial-account-summary
      with:
        customerId: tools.customerId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-commercial-transactions
      description: Retrieve commercial account transactions with filtering by date range and payment type (ACH, wire, check,
        book transfer).
      hints:
        readOnly: true
        openWorld: false
      call: truist-commercial-transactions.list-commercial-transactions
      with:
        accountId: tools.accountId
        fromDate: tools.fromDate
        toDate: tools.toDate
        transactionType: tools.transactionType
        debitCreditIndicator: tools.debitCreditIndicator
      outputParameters:
      - type: object
        mapping: $.
    - name: get-commercial-transaction
      description: Get details for a specific commercial account transaction including ACH trace numbers, wire reference numbers,
        and check numbers.
      hints:
        readOnly: true
        openWorld: false
      call: truist-commercial-transactions.get-commercial-transaction
      with:
        accountId: tools.accountId
        transactionId: tools.transactionId
      outputParameters:
      - type: object
        mapping: $.
