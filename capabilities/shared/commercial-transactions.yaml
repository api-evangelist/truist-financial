naftiko: "1.0.0-alpha1"

info:
  label: "Truist Commercial Account Transactions API"
  description: "Enables retrieval of commercial account transaction data including ACH, wires, checks, and other payment types."
  tags:
    - Banking
    - Commercial Banking
    - Transactions
    - Treasury
    - Payments
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRUIST_COMMERCIAL_OAUTH2_TOKEN: TRUIST_COMMERCIAL_OAUTH2_TOKEN

capability:
  consumes:
    - type: http
      namespace: truist-commercial-transactions
      baseUri: https://api.truist.com/v1
      description: "Commercial banking transaction history API."
      authentication:
        type: bearer
        token: "{{TRUIST_COMMERCIAL_OAUTH2_TOKEN}}"
      resources:
        - name: commercial-transactions
          path: /commercial/accounts/{accountId}/transactions
          description: "Commercial account transaction history"
          operations:
            - name: list-commercial-transactions
              method: GET
              description: "Retrieve commercial account transactions including ACH, wires, and checks."
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                  description: "Unique account identifier"
                - name: fromDate
                  in: query
                  type: string
                  required: false
                  description: "Start date (YYYY-MM-DD)"
                - name: toDate
                  in: query
                  type: string
                  required: false
                  description: "End date (YYYY-MM-DD)"
                - name: transactionType
                  in: query
                  type: string
                  required: false
                  description: "Filter by ACH, WIRE, CHECK, BOOK_TRANSFER, FEE, INTEREST, or ALL"
                - name: debitCreditIndicator
                  in: query
                  type: string
                  required: false
                  description: "Filter by DEBIT or CREDIT"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of transactions"
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: commercial-transaction
          path: /commercial/accounts/{accountId}/transactions/{transactionId}
          description: "Individual commercial transaction details"
          operations:
            - name: get-commercial-transaction
              method: GET
              description: "Retrieve details for a specific commercial account transaction."
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                  description: "Unique account identifier"
                - name: transactionId
                  in: path
                  type: string
                  required: true
                  description: "Unique transaction identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8103
      namespace: truist-commercial-transactions-api
      resources:
        - path: /v1/commercial/accounts/{accountId}/transactions
          name: commercial-transactions
          description: "List commercial account transactions"
          operations:
            - method: GET
              name: list-commercial-transactions
              description: "List commercial transactions"
              call: "truist-commercial-transactions.list-commercial-transactions"
              with:
                accountId: "rest.accountId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/commercial/accounts/{accountId}/transactions/{transactionId}
          name: commercial-transaction
          description: "Get a specific commercial transaction"
          operations:
            - method: GET
              name: get-commercial-transaction
              description: "Get commercial transaction details"
              call: "truist-commercial-transactions.get-commercial-transaction"
              with:
                accountId: "rest.accountId"
                transactionId: "rest.transactionId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9103
      namespace: truist-commercial-transactions-mcp
      transport: http
      tools:
        - name: list-commercial-transactions
          description: "Retrieve commercial account transaction history including ACH, wires, and checks with date and type filtering."
          hints:
            readOnly: true
            openWorld: false
          call: "truist-commercial-transactions.list-commercial-transactions"
          with:
            accountId: "tools.accountId"
            fromDate: "tools.fromDate"
            toDate: "tools.toDate"
            transactionType: "tools.transactionType"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-commercial-transaction
          description: "Get details for a specific commercial account transaction."
          hints:
            readOnly: true
            openWorld: false
          call: "truist-commercial-transactions.get-commercial-transaction"
          with:
            accountId: "tools.accountId"
            transactionId: "tools.transactionId"
          outputParameters:
            - type: object
              mapping: "$."
