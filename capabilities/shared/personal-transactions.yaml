naftiko: "1.0.0-alpha1"

info:
  label: "Truist Personal and Small Business Transactions API"
  description: "Enables retrieval of transaction history for personal and small business accounts."
  tags:
    - Banking
    - Transactions
    - Personal Banking
    - Small Business
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRUIST_OAUTH2_TOKEN: TRUIST_OAUTH2_TOKEN

capability:
  consumes:
    - type: http
      namespace: truist-personal-transactions
      baseUri: https://api.truist.com/v1
      description: "Personal and small business transaction history API."
      authentication:
        type: bearer
        token: "{{TRUIST_OAUTH2_TOKEN}}"
      resources:
        - name: personal-transactions
          path: /personal/accounts/{accountId}/transactions
          description: "Personal account transaction history"
          operations:
            - name: list-personal-transactions
              method: GET
              description: "Retrieve posted and pending transactions for a personal or small business account."
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                  description: "Unique account identifier"
                - name: fromDate
                  in: query
                  type: string
                  required: false
                  description: "Start date (YYYY-MM-DD)"
                - name: toDate
                  in: query
                  type: string
                  required: false
                  description: "End date (YYYY-MM-DD)"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by POSTED, PENDING, or ALL"
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of transactions"
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Pagination offset"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: personal-transaction
          path: /personal/accounts/{accountId}/transactions/{transactionId}
          description: "Individual transaction details"
          operations:
            - name: get-personal-transaction
              method: GET
              description: "Retrieve details for a specific transaction on a personal or small business account."
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                  description: "Unique account identifier"
                - name: transactionId
                  in: path
                  type: string
                  required: true
                  description: "Unique transaction identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: truist-personal-transactions-api
      resources:
        - path: /v1/personal/accounts/{accountId}/transactions
          name: personal-transactions
          description: "List personal account transactions"
          operations:
            - method: GET
              name: list-personal-transactions
              description: "List transactions for a personal account"
              call: "truist-personal-transactions.list-personal-transactions"
              with:
                accountId: "rest.accountId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/personal/accounts/{accountId}/transactions/{transactionId}
          name: personal-transaction
          description: "Get a specific personal transaction"
          operations:
            - method: GET
              name: get-personal-transaction
              description: "Get transaction details"
              call: "truist-personal-transactions.get-personal-transaction"
              with:
                accountId: "rest.accountId"
                transactionId: "rest.transactionId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: truist-personal-transactions-mcp
      transport: http
      tools:
        - name: list-personal-transactions
          description: "Retrieve transaction history for a personal or small business account with date range filtering."
          hints:
            readOnly: true
            openWorld: false
          call: "truist-personal-transactions.list-personal-transactions"
          with:
            accountId: "tools.accountId"
            fromDate: "tools.fromDate"
            toDate: "tools.toDate"
            status: "tools.status"
            limit: "tools.limit"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-personal-transaction
          description: "Get details for a specific personal account transaction."
          hints:
            readOnly: true
            openWorld: false
          call: "truist-personal-transactions.get-personal-transaction"
          with:
            accountId: "tools.accountId"
            transactionId: "tools.transactionId"
          outputParameters:
            - type: object
              mapping: "$."
