naftiko: "1.0.0-alpha1"

info:
  label: "Truist Personal and Small Business Accounts API"
  description: "Provides access to consumer and small business deposit account details and balances."
  tags:
    - Banking
    - Accounts
    - Personal Banking
    - Small Business
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRUIST_OAUTH2_TOKEN: TRUIST_OAUTH2_TOKEN

capability:
  consumes:
    - type: http
      namespace: truist-personal-accounts
      baseUri: https://api.truist.com/v1
      description: "Personal and small business account information API."
      authentication:
        type: bearer
        token: "{{TRUIST_OAUTH2_TOKEN}}"
      resources:
        - name: personal-accounts
          path: /personal/accounts
          description: "Personal and small business deposit accounts"
          operations:
            - name: list-personal-accounts
              method: GET
              description: "Retrieve a list of personal and small business deposit accounts for the authenticated client."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: personal-account
          path: /personal/accounts/{accountId}
          description: "Individual personal account details"
          operations:
            - name: get-personal-account
              method: GET
              description: "Retrieve details for a specific personal or small business deposit account."
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                  description: "Unique account identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: personal-account-balances
          path: /personal/accounts/{accountId}/balances
          description: "Personal account balance information"
          operations:
            - name: get-personal-account-balances
              method: GET
              description: "Retrieve current and available balances for a personal or small business account."
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                  description: "Unique account identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: truist-personal-accounts-api
      resources:
        - path: /v1/personal/accounts
          name: personal-accounts
          description: "List personal and small business accounts"
          operations:
            - method: GET
              name: list-personal-accounts
              description: "List personal accounts"
              call: "truist-personal-accounts.list-personal-accounts"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/personal/accounts/{accountId}
          name: personal-account
          description: "Get a specific personal account"
          operations:
            - method: GET
              name: get-personal-account
              description: "Get personal account details"
              call: "truist-personal-accounts.get-personal-account"
              with:
                accountId: "rest.accountId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/personal/accounts/{accountId}/balances
          name: personal-account-balances
          description: "Get personal account balances"
          operations:
            - method: GET
              name: get-personal-account-balances
              description: "Get account balances"
              call: "truist-personal-accounts.get-personal-account-balances"
              with:
                accountId: "rest.accountId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: truist-personal-accounts-mcp
      transport: http
      tools:
        - name: list-personal-accounts
          description: "Retrieve all personal and small business deposit accounts for the authenticated client."
          hints:
            readOnly: true
            openWorld: false
          call: "truist-personal-accounts.list-personal-accounts"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-personal-account
          description: "Get details for a specific personal or small business deposit account."
          hints:
            readOnly: true
            openWorld: false
          call: "truist-personal-accounts.get-personal-account"
          with:
            accountId: "tools.accountId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-personal-account-balances
          description: "Get current and available balances for a personal or small business account."
          hints:
            readOnly: true
            openWorld: false
          call: "truist-personal-accounts.get-personal-account-balances"
          with:
            accountId: "tools.accountId"
          outputParameters:
            - type: object
              mapping: "$."
